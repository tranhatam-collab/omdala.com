# Fluentd configuration for OMDALA log aggregation
# Sends container logs to Loki (or Cloudflare Logpush)

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type tail
  path /var/log/omdala/api-gateway/*.log
  pos_file /var/log/omdala/api-gateway.log.pos
  tag omdala.api-gateway
  <parse>
    @type json
    time_key timestamp
    time_format %iso8601
  </parse>
</source>

<source>
  @type tail
  path /var/log/omdala/worker/*.log
  pos_file /var/log/omdala/worker.log.pos
  tag omdala.worker
  <parse>
    @type json
    time_key timestamp
    time_format %iso8601
  </parse>
</source>

# Filter: add tenant_id and environment labels
<filter omdala.**>
  @type record_transformer
  <record>
    env ${ENVIRONMENT:-production}
    service ${tag_parts[1]}
  </record>
</filter>

# Output to Loki (primary)
<match omdala.**>
  @type loki
  url http://loki:3100
  username ${LOKI_USERNAME}
  password ${LOKI_PASSWORD}
  <label>
    env
    service
    tenant_id
  </label>
  <buffer>
    flush_interval 5s
    chunk_limit_size 2m
    queue_limit_length 32
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

# Fallback: output to stdout for debugging
<match omdala.**>
  @type stdout
</match>
