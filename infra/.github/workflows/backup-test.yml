name: Backup Test

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday 06:00 UTC
  workflow_dispatch:

jobs:
  backup-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AWS CLI for R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Verify latest backup exists
        run: |
          LATEST=$(aws s3 ls s3://${{ secrets.R2_BUCKET_BACKUPS }}/backups/postgres/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} --region auto \
            | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "ERROR: No backup found!"
            exit 1
          fi
          echo "Latest backup: $LATEST"

      - name: Download and verify backup
        run: |
          aws s3 cp s3://${{ secrets.R2_BUCKET_BACKUPS }}/backups/postgres/$LATEST /tmp/test-backup.sql.gz \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} --region auto
          # Verify gzip integrity
          gunzip -t /tmp/test-backup.sql.gz

      - name: Restore to test database
        run: |
          # Start PostgreSQL in container
          docker run -d --name pg-test -e POSTGRES_PASSWORD=test postgres:17-alpine
          sleep 10
          # Create test DB
          docker exec pg-test psql -U postgres -c "CREATE DATABASE omdala_restore_test;"
          # Restore
          gunzip -c /tmp/test-backup.sql.gz | docker exec -i pg-test psql -U postgres -d omdala_restore_test
          # Verify row counts
          docker exec pg-test psql -U postgres -d omdala_restore_test -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='omdala';"

      - name: Cleanup
        if: always()
        run: |
          docker stop pg-test && docker rm pg-test
          rm -f /tmp/test-backup.sql.gz

      - name: Notify
        if: always()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"Weekly restore test: ${{ job.status }}"}'
