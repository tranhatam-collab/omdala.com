name: OMDALA Surface Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit SHA to release
        required: true
        default: main
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type DEPLOY_OMDALA_SURFACES to authorize the release
        required: true
      source_pr_number:
        description: Pull request containing the exact candidate and its independent approval
        required: true
        type: string
      staging_acceptance_run_id:
        description: Successful staging acceptance workflow run ID; required for production
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: omdala-surfaces-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy exact-candidate surfaces
    if: inputs.confirmation == 'DEPLOY_OMDALA_SURFACES'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - id: identity
        name: Lock source and surface release identity
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          release_id="pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - id: independent_review
        name: Require independent exact-SHA approval
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release-review-policy.mjs
          --repository "${{ github.repository }}"
          --pull-request "${{ inputs.source_pr_number }}"
          --sha "${{ steps.identity.outputs.sha }}"
          --receipt independent-review-receipt.json
      - name: Require staging acceptance run for production
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.staging_acceptance_run_id }}" =~ ^[0-9]+$ ]] || {
            echo "::error::A numeric staging_acceptance_run_id is required for production"
            exit 1
          }
      - name: Verify staging acceptance workflow identity
        if: inputs.environment == 'production'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.staging_acceptance_run_id }}
        run: |
          set -euo pipefail
          run_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}")"
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            '.name == "OMDALA Staging Go-Live E2E" and
             .event == "workflow_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .head_sha == $sha' \
            <<<"$run_json" >/dev/null || {
              echo "::error::Staging acceptance run is not a successful exact-SHA run"
              exit 1
            }
      - name: Download immutable staging acceptance receipt
        if: inputs.environment == 'production'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omdala-staging-acceptance-${{ steps.identity.outputs.sha }}
          path: staging-acceptance
          github-token: ${{ github.token }}
          run-id: ${{ inputs.staging_acceptance_run_id }}
      - name: Verify staging acceptance receipt
        if: inputs.environment == 'production'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          ACCEPTANCE_RUN_ID: ${{ inputs.staging_acceptance_run_id }}
        run: |
          set -euo pipefail
          jq -e \
            --arg sha "$EXPECTED_SHA" \
            --arg run_id "$ACCEPTANCE_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.verdict == "STAGING_ACCEPTED" and
             .candidate_sha == $sha and
             .workflow_run_id == ($run_id | tonumber) and
             .repository == $repository and
             (.source_pr_number | tostring) == "${{ inputs.source_pr_number }}" and
             (.independent_reviewer | length) > 0 and
             (.independent_review_id | tonumber) > 0 and
             (.database_backup_receipt_sha256 | length) == 64 and
             (.api_release_run_id | tonumber) > 0 and
             (.surface_release_run_id | tonumber) > 0 and
             (.api_deployment_id | length) > 0 and
             (.surface_release_id | length) > 0' \
            staging-acceptance/staging-acceptance.json >/dev/null || {
              echo "::error::Staging acceptance artifact does not bind this production SHA"
              exit 1
            }
      - name: Guard production release SHA on main
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ steps.identity.outputs.sha }}" origin/main || {
            echo "::error::Production surface SHA is not on origin/main"
            exit 1
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-run exact-candidate source and local E2E gates
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm lint
          pnpm typecheck
          pnpm --filter @omdala/api test
          pnpm --filter @omdala/api run check
          pnpm --filter @omdala/app test
          pnpm --filter @omdala/brand-marketplace test
          pnpm --filter @omdala/brand-marketplace run lint
          pnpm --filter @omdala/brand-marketplace run typecheck
          pnpm --filter @omdala/app exec playwright install --with-deps chromium
          pnpm e2e:web
          pnpm e2e:app
          pnpm e2e:brand-exchange
      - name: Require protected release configuration
        shell: bash
        env:
          API_URL: ${{ vars.OMDALA_API_URL }}
          APP_URL: ${{ vars.OMDALA_APP_URL }}
          WEB_URL: ${{ vars.OMDALA_WEB_URL }}
          BRAND_URL: ${{ vars.OMDALA_BRAND_URL }}
          WEB_PROJECT: ${{ vars.OMDALA_WEB_PAGES_PROJECT }}
          APP_PROJECT: ${{ vars.OMDALA_APP_PAGES_PROJECT }}
          BRAND_PROJECT: ${{ vars.OMDALA_BRAND_PAGES_PROJECT }}
          PRODUCTION_BRANCH: ${{ vars.OMDALA_PAGES_PRODUCTION_BRANCH }}
          STAGING_BRANCH: ${{ vars.OMDALA_PAGES_STAGING_BRANCH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in API_URL APP_URL WEB_URL BRAND_URL WEB_PROJECT APP_PROJECT BRAND_PROJECT CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            test -n "${!name:-}" || {
              echo "::error::Protected environment value $name is required"
              exit 1
            }
          done
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            test -n "${PRODUCTION_BRANCH:-}" || {
              echo "::error::OMDALA_PAGES_PRODUCTION_BRANCH is required"
              exit 1
            }
          else
            test -n "${STAGING_BRANCH:-}" || {
              echo "::error::OMDALA_PAGES_STAGING_BRANCH is required"
              exit 1
            }
          fi
      - name: Build static surface artifacts
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.OMDALA_API_URL }}
          NEXT_PUBLIC_OMDALA_API_BASE_URL: ${{ vars.OMDALA_API_URL }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ vars.OMDALA_APP_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @omdala/web run build
          pnpm --filter @omdala/app run build
          pnpm --filter @omdala/brand-marketplace run build
          node scripts/write-surface-release.mjs apps/web/out web "${{ inputs.environment }}" "${{ steps.identity.outputs.sha }}" "${{ steps.identity.outputs.release_id }}"
          node scripts/write-surface-release.mjs apps/app/out app "${{ inputs.environment }}" "${{ steps.identity.outputs.sha }}" "${{ steps.identity.outputs.release_id }}"
          node scripts/write-surface-release.mjs apps/brand-marketplace/out brand "${{ inputs.environment }}" "${{ steps.identity.outputs.sha }}" "${{ steps.identity.outputs.release_id }}"
      - name: Deploy Web, App, and Brand Pages artifacts
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_PROJECT: ${{ vars.OMDALA_WEB_PAGES_PROJECT }}
          APP_PROJECT: ${{ vars.OMDALA_APP_PAGES_PROJECT }}
          BRAND_PROJECT: ${{ vars.OMDALA_BRAND_PAGES_PROJECT }}
          PRODUCTION_BRANCH: ${{ vars.OMDALA_PAGES_PRODUCTION_BRANCH }}
          STAGING_BRANCH: ${{ vars.OMDALA_PAGES_STAGING_BRANCH }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            branch="$PRODUCTION_BRANCH"
          else
            branch="$STAGING_BRANCH"
          fi
          common=(--branch "$branch" --commit-hash "${{ steps.identity.outputs.sha }}" --commit-message "${{ steps.identity.outputs.release_id }}")
          services/api/node_modules/.bin/wrangler pages deploy apps/web/out --project-name "$WEB_PROJECT" "${common[@]}"
          services/api/node_modules/.bin/wrangler pages deploy apps/app/out --project-name "$APP_PROJECT" "${common[@]}"
          services/api/node_modules/.bin/wrangler pages deploy apps/brand-marketplace/out --project-name "$BRAND_PROJECT" "${common[@]}"
      - name: Verify live surface identity and semantic routes
        shell: bash
        env:
          WEB_URL: ${{ vars.OMDALA_WEB_URL }}
          APP_URL: ${{ vars.OMDALA_APP_URL }}
          BRAND_URL: ${{ vars.OMDALA_BRAND_URL }}
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          EXPECTED_RELEASE_ID: ${{ steps.identity.outputs.release_id }}
        run: |
          set -euo pipefail
          verify_release() {
            local surface="$1"
            local base_url="$2"
            local receipt=""
            for _ in {1..12}; do
              if receipt="$(curl --fail --silent --show-error "${base_url%/}/release.json")"; then
                if jq -e --arg surface "$surface" --arg environment "${{ inputs.environment }}" --arg sha "$EXPECTED_SHA" --arg release_id "$EXPECTED_RELEASE_ID" '.surface == $surface and .environment == $environment and .release_sha == $sha and .release_id == $release_id' <<<"$receipt" >/dev/null; then
                  return 0
                fi
              fi
              sleep 10
            done
            echo "::error::$surface did not expose the expected release identity"
            return 1
          }
          verify_release web "$WEB_URL"
          verify_release app "$APP_URL"
          verify_release brand "$BRAND_URL"
          curl --fail --silent --show-error "${WEB_URL%/}/" >/dev/null
          curl --fail --silent --show-error "${WEB_URL%/}/vi/" >/dev/null
          curl --fail --silent --show-error "${APP_URL%/}/workspace/" >/dev/null
          curl --fail --silent --show-error "${BRAND_URL%/}/en/" >/dev/null
          curl --fail --silent --show-error "${BRAND_URL%/}/vi/" >/dev/null
          {
            echo "### OMDALA surface deployment receipt"
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Release SHA: $EXPECTED_SHA"
            echo "- Surface release ID: $EXPECTED_RELEASE_ID"
            echo "- Web/App/Brand identity: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write immutable surface release receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg candidate_sha "${{ steps.identity.outputs.sha }}" \
            --arg release_id "${{ steps.identity.outputs.release_id }}" \
            --arg source_pr_number "${{ inputs.source_pr_number }}" \
            --arg independent_reviewer "${{ steps.independent_review.outputs.reviewer }}" \
            --arg independent_review_id "${{ steps.independent_review.outputs.review_id }}" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              verdict: "SURFACE_RELEASE_ACCEPTED",
              environment: $environment,
              candidate_sha: $candidate_sha,
              release_id: $release_id,
              source_pr_number: ($source_pr_number | tonumber),
              independent_reviewer: $independent_reviewer,
              independent_review_id: ($independent_review_id | tonumber),
              workflow_run_id: ($workflow_run_id | tonumber),
              workflow_run_attempt: ($workflow_run_attempt | tonumber),
              repository: $repository,
              created_at: $created_at
            }' > surface-release.json
          jq -e \
            --arg sha "${{ steps.identity.outputs.sha }}" \
            '.verdict == "SURFACE_RELEASE_ACCEPTED" and .candidate_sha == $sha' \
            surface-release.json >/dev/null
      - name: Upload immutable surface release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omdala-surface-release-${{ steps.identity.outputs.sha }}-${{ inputs.environment }}
          path: surface-release.json
          if-no-files-found: error
          retention-days: 30
