name: OMDALA Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit SHA to release
        required: true
        default: main
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type DEPLOY_OMDALA to authorize the release
        required: true

permissions:
  contents: read

concurrency:
  group: omdala-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    if: inputs.confirmation == 'DEPLOY_OMDALA'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm --filter @omdala/api test
      - run: pnpm --filter @omdala/api run check
      - name: Require an explicit runtime data binding
        run: |
          if ! grep -Eq '^\[\[(d1_databases|hyperdrive)\]\]|^\[\[env\.[^.]+\.(d1_databases|hyperdrive)\]\]' services/api/wrangler.toml; then
            echo "Release blocked: services/api/wrangler.toml declares no D1 or Hyperdrive binding."
            exit 1
          fi
      - run: pnpm --filter @omdala/api exec wrangler deploy --dry-run
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy omdala-api
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Record deployed source
        run: echo "Deployed omdala-api from ${{ needs.validate.outputs.sha }} to ${{ inputs.environment }}"
