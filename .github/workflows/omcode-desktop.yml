name: OMCODE Desktop Candidate

on:
  pull_request:
    paths:
      - "apps/omcode-desktop/**"
      - ".github/workflows/omcode-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omcode-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verification:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/omcode-desktop
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/omcode-desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser runtimes
        run: npx playwright install chromium webkit

      - name: Verify exact desktop candidate
        run: npm run verify:all

      - name: Preserve release receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omcode-desktop-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/omcode-desktop/evidence/*.json
            apps/omcode-desktop/evidence/runs/**
            apps/omcode-desktop/release/OMCODE.app.manifest.json
          if-no-files-found: error
          retention-days: 30
