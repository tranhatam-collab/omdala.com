name: OMDALA CI

on:
  push:
    branches: [main, feat/pricing-promo-engine, "OMCODE/**"]
  pull_request:
    branches: [main]

jobs:
  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-api:
    name: API Tests (72 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/api test
      - run: pnpm --filter @omdala/api run check

  test-app:
    name: App Tests (27 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app test

  test-core:
    name: Core + D1 Tenant Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/core test

  test-brand-core:
    name: Brand Core Tests (33 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:brand-core

  test-brand-marketplace:
    name: Brand Marketplace Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/brand-marketplace test

  test-billing:
    name: Billing and Promotion Tests (27 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/billing test

  test-om-ai-backend:
    name: OM AI Backend Tests (11 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: om-ai.omdala.com/backend
      - run: npm run build
        working-directory: om-ai.omdala.com/backend
      - run: npm test
        working-directory: om-ai.omdala.com/backend

  test-om-ai-gateway:
    name: OM AI Gateway Tests (9 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: om-ai.omdala.com/gateway
      - run: npm test
        working-directory: om-ai.omdala.com/gateway

  test-om-ai-mobile-contract:
    name: OM AI Mobile Contract Tests (2 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: om-ai.omdala.com/app/package-lock.json
      - run: npm ci
        working-directory: om-ai.omdala.com/app
      - run: npm test
        working-directory: om-ai.omdala.com/app

  test-infra-gateway:
    name: Infra API Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: infra/services/api-gateway
      - run: npm test
        working-directory: infra/services/api-gateway
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          PORT: 9999

  test-infra-worker:
    name: Infra Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: infra/services/worker
      - run: npm test
        working-directory: infra/services/worker
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  build-nextjs:
    name: Next.js Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, app, docs, admin, auth]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/${{ matrix.app }} && pnpm exec next build
      - name: Verify static Pages artifact
        if: matrix.app == 'web' || matrix.app == 'app' || matrix.app == 'docs' || matrix.app == 'admin' || matrix.app == 'auth'
        run: test -f apps/${{ matrix.app }}/out/index.html

  build-brand-exchange:
    name: Brand Exchange Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/brand-marketplace run lint
      - run: pnpm --filter @omdala/brand-marketplace run typecheck
      - run: pnpm --filter @omdala/brand-marketplace run build
      - run: test -f apps/brand-marketplace/out/index.html

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  e2e-app:
    name: App Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:app
        env:
          CI: 'true'

  e2e-web:
    name: Web Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:web
        env:
          CI: 'true'

  e2e-brand-exchange:
    name: Brand Exchange Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:brand-exchange
        env:
          CI: 'true'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Pin nested audit CLI
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - run: pnpm install --frozen-lockfile
      - name: Check for secrets in code
        run: |
          ! grep -rE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=out \
            --exclude-dir=.next \
            --exclude='pnpm-lock.yaml' \
            . && echo "No hardcoded secrets found"
      - name: Audit dependencies
        run: pnpm security:audit
        timeout-minutes: 5
      - name: Install nested audit dependency trees
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            om-ai.omdala.com/backend \
            om-ai.omdala.com/gateway \
            infra/services/api-gateway \
            infra/services/worker
          do
            npm ci --ignore-scripts --audit=false --prefix "$directory"
          done
      - name: Audit OM AI backend dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com/backend
      - name: Audit OM AI gateway dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com/gateway
      - name: Audit Infra API Gateway dependencies
        run: npm audit --audit-level=high
        working-directory: infra/services/api-gateway
      - name: Audit Infra Worker dependencies
        run: npm audit --audit-level=high
        working-directory: infra/services/worker
