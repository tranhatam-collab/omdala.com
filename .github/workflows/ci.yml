name: OMDALA CI

on:
  push:
    branches: [main, feat/pricing-promo-engine, "OMCODE/**", "claude/omdala-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-governance-tests:
    name: Release Governance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - run: npm run test:release-governance

  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # WO-T2-30: a throwaway PostgreSQL with TLS on, so the database-gated API suites run here
      # instead of skipping. The certificate is generated in this job and is valid for 2 days;
      # nothing in it is a secret, and the server listens on 127.0.0.1 of this runner only.
      - name: Start a throwaway PostgreSQL with TLS
        run: |
          set -euo pipefail
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$PGBIN" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
            PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          fi
          D="$RUNNER_TEMP/pgtest"
          mkdir -p "$D"
          "$PGBIN/initdb" -D "$D/data" -A trust -U postgres > /dev/null
          openssl req -new -x509 -days 2 -nodes -subj /CN=localhost -out "$D/server.crt" -keyout "$D/server.key"
          chmod 600 "$D/server.key"
          {
            echo "ssl = on"
            echo "ssl_cert_file = '$D/server.crt'"
            echo "ssl_key_file = '$D/server.key'"
          } >> "$D/data/postgresql.conf"
          "$PGBIN/pg_ctl" -D "$D/data" -o "-p 55432 -k $D -c listen_addresses=127.0.0.1" -l "$D/log" -w start
          echo "$PGBIN" >> "$GITHUB_PATH"
          echo "OMDALA_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/postgres" >> "$GITHUB_ENV"
      - run: pnpm --filter @omdala/api test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-api.json"
      - name: Every API test ran (none skipped)
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/vitest-api.json", "utf8"));
            console.log("total", r.numTotalTests, "passed", r.numPassedTests, "failed", r.numFailedTests, "skipped", r.numPendingTests);
            if (r.numFailedTests !== 0 || r.numPendingTests !== 0) process.exit(1);
          '
      - run: pnpm --filter @omdala/api run check

  test-app:
    name: App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app test

  test-core:
    name: Core + D1 Tenant Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/core test

  test-brand-core:
    name: Brand Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:brand-core

  test-brand-marketplace:
    name: Brand Marketplace Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/brand-marketplace test

  test-billing:
    name: Billing and Promotion Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/billing test

  test-om-ai-backend:
    name: OM AI Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: om-ai.omdala.com/backend
      - run: npm run build
        working-directory: om-ai.omdala.com/backend
      - run: npm test
        working-directory: om-ai.omdala.com/backend

  test-om-ai-gateway:
    name: OM AI Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: om-ai.omdala.com/gateway
      - run: npm test
        working-directory: om-ai.omdala.com/gateway

  test-om-ai-web:
    name: OM AI Web Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: om-ai.omdala.com/web/package-lock.json
      - run: npm ci
        working-directory: om-ai.omdala.com/web
      - run: npm run typecheck
        working-directory: om-ai.omdala.com/web
      - run: npm run build
        working-directory: om-ai.omdala.com/web

  test-om-ai-mobile-contract:
    name: OM AI Mobile Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: om-ai.omdala.com/app/package-lock.json
      - run: npm ci
        working-directory: om-ai.omdala.com/app
      - run: npm test
        working-directory: om-ai.omdala.com/app

  test-infra-gateway:
    name: Infra API Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: infra/services/api-gateway
      - run: npm test
        working-directory: infra/services/api-gateway
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          PORT: 9999

  test-infra-worker:
    name: Infra Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - run: npm ci
        working-directory: infra/services/worker
      - run: npm test
        working-directory: infra/services/worker
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  build-nextjs:
    name: Next.js Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, app, docs, admin, auth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/${{ matrix.app }} && pnpm exec next build
      - name: Verify static Pages artifact
        if: matrix.app == 'web' || matrix.app == 'app' || matrix.app == 'docs' || matrix.app == 'admin' || matrix.app == 'auth'
        run: test -f apps/${{ matrix.app }}/out/index.html

  build-brand-exchange:
    name: Brand Exchange Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/brand-marketplace run lint
      - run: pnpm --filter @omdala/brand-marketplace run typecheck
      - run: pnpm --filter @omdala/brand-marketplace run build
      - run: test -f apps/brand-marketplace/out/index.html

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  e2e-app:
    name: App Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify staging Playwright config loader
        run: node --test scripts/playwright-staging-loader.test.mjs
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:app
        env:
          CI: 'true'

  e2e-web:
    name: Web Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:web
        env:
          CI: 'true'

  e2e-brand-exchange:
    name: Brand Exchange Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:brand-exchange
        env:
          CI: 'true'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: 'pnpm'
      - name: Pin nested audit CLI
        run: |
          npm install --global npm@10.9.8
          test "$(npm --version)" = "10.9.8"
      - run: pnpm install --frozen-lockfile
      - name: Check for secrets in code
        run: |
          ! grep -rE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=out \
            --exclude-dir=.next \
            --exclude='pnpm-lock.yaml' \
            . && echo "No hardcoded secrets found"
      - name: Audit dependencies
        run: pnpm security:audit
        timeout-minutes: 5
      - name: Install nested audit dependency trees
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            om-ai.omdala.com \
            om-ai.omdala.com/backend \
            om-ai.omdala.com/gateway \
            om-ai.omdala.com/web \
            om-ai.omdala.com/app \
            infra/services/api-gateway \
            infra/services/worker
          do
            npm ci --ignore-scripts --audit=false --prefix "$directory"
          done
      - name: Audit OM AI backend dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com/backend
      - name: Audit OM AI root dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com
      - name: Audit OM AI gateway dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com/gateway
      - name: Audit OM AI web dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com/web
      - name: Audit OM AI mobile dependencies
        run: npm audit --audit-level=high
        working-directory: om-ai.omdala.com/app
      - name: Audit Infra API Gateway dependencies
        run: npm audit --audit-level=high
        working-directory: infra/services/api-gateway
      - name: Audit Infra Worker dependencies
        run: npm audit --audit-level=high
        working-directory: infra/services/worker
