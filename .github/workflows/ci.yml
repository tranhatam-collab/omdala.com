name: OMDALA CI

on:
  push:
    branches: [main, feat/pricing-promo-engine, "OMCODE/**"]
  pull_request:
    branches: [main]

jobs:
  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --project packages/core/tsconfig.json
      - run: pnpm exec tsc --noEmit --project packages/seo/tsconfig.json
      - run: pnpm exec tsc --noEmit --project packages/types/tsconfig.json
      - run: pnpm exec tsc --noEmit --project packages/ui/tsconfig.json

  test-api:
    name: API Tests (32 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/api test

  test-app:
    name: App Tests (27 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app test

  test-core:
    name: Core + D1 Tenant Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/core test

  test-infra-gateway:
    name: Infra API Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: infra/services/api-gateway
      - run: npm test
        working-directory: infra/services/api-gateway
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          PORT: 9999

  test-infra-worker:
    name: Infra Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: infra/services/worker
      - run: npm test
        working-directory: infra/services/worker
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  build-nextjs:
    name: Next.js Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, app, docs, admin, auth]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/${{ matrix.app }} && pnpm exec next build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  e2e-app:
    name: App Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:app
        env:
          CI: 'true'

  e2e-web:
    name: Web Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omdala/app exec playwright install --with-deps chromium
      - run: pnpm e2e:web
        env:
          CI: 'true'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check for secrets in code
        run: |
          ! grep -rE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=out \
            --exclude-dir=.next \
            --exclude='pnpm-lock.yaml' \
            . && echo "No hardcoded secrets found"
      - name: Audit dependencies
        run: pnpm security:audit
        timeout-minutes: 5
